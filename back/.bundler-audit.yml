  # Each affected path is also unreachable for us — through ruby_llm we only ever
  # use the bedrock and vertexai providers:
  #   - 42r3: Utils.underscore. Call sites only ever receive Ruby class names, and
  #     we use neither Tool nor Agent.
  #   - 5m38: <think> tag parsing. It lives in the OpenAI provider's chat parsing,
  #     which neither Bedrock nor VertexAI includes; our GPT models go through the
  #     separate `openai` gem instead.
  #   - 57hg: Mistral capability matching. Only reached while listing models for
  #     the Mistral provider, which requires mistral_api_key and is therefore
  #     skipped as unconfigured.
  # Patched only in 2.0.0; there is no 1.16.x backport. That bump is a breaking
  # major for us (RubyLLM::Content removed, refresh! renamed, structured output
  # moves from `content` to `parsed`) and is tracked as its own piece of work.
